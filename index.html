<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Travel diary: plan each day, write notes, keep photos, and export a view-only HTML keepsake.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Travel Diary">
<title>Travel Diary</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Cpath d='M9 22l14-6-14-6v4.5l9 1.5-9 1.5z' fill='white'/%3E%3C/svg%3E">
<style id="app-css">
:root{--bg:#f5f7fb;--card:#fff;--soft:#f8fafc;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--accent-soft:rgba(37,99,235,.1);--danger:#dc2626;--shadow:0 10px 24px rgba(15,23,42,.07);--r:18px;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f141c;--card:#171e29;--soft:#1d2532;--text:#e5e9f0;--muted:#98a2b3;--line:#2a3443;--accent:#5b8cff;--accent-soft:rgba(91,140,255,.14);--shadow:0 10px 24px rgba(0,0,0,.35);color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:920px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
h1{font-size:1.6rem;line-height:1.2;margin:0 0 6px}
h2{font-size:1.1rem;margin:0 0 10px}
h3{font-size:.95rem;margin:0 0 8px}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.hero,.panel,.day,.trip-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.hero{padding:20px;margin-bottom:14px}
.panel{padding:16px;margin-bottom:14px}
.topbar a{display:inline-block;padding:6px 0 10px;color:var(--accent);font-weight:700;text-decoration:none}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.stat{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.stat b{display:block;font-size:1rem;overflow-wrap:anywhere}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 14px;border-radius:12px;border:1px solid transparent;background:var(--accent);color:#fff;font:inherit;font-weight:700;font-size:.92rem;text-decoration:none;cursor:pointer}
.btn.secondary{background:var(--card);color:var(--text);border-color:var(--line)}
.btn.danger{background:var(--danger)}
.btn.ghost{background:rgba(255,255,255,.14)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.banner{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:.92rem}
.foot{text-align:center;margin-top:16px}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.8rem;font-weight:700;border:1px solid}
.chip.easy,.chip.now{background:#ecfdf3;color:#166534;border-color:#bbf7d0}
.chip.medium,.chip.upcoming{background:#fff7ed;color:#9a3412;border-color:#fed7aa}
.chip.long{background:#fef2f2;color:#991b1b;border-color:#fecaca}
.chip.done{background:var(--soft);color:var(--muted);border-color:var(--line)}
/* Home */
.trip-list{display:grid;gap:12px}
.trip-card{display:flex;gap:14px;align-items:center;padding:12px;color:inherit;text-decoration:none}
.trip-cover{width:84px;height:84px;border-radius:14px;flex-shrink:0;background:var(--soft) center/cover no-repeat;border:1px solid var(--line);display:grid;place-items:center;font-size:1.6rem;color:var(--muted)}
.trip-name{font-weight:800;font-size:1.05rem}
.trip-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
.empty{text-align:center;color:var(--muted)}
/* Today */
.today-title{font-weight:800;font-size:1.05rem}
.today-must{font-weight:700;color:#b91c1c;margin:6px 0 0}
/* Days */
.days{display:grid;gap:12px}
.day{overflow:hidden}
.day.today{border-color:var(--accent)}
.day-head{all:unset;box-sizing:border-box;width:100%;display:flex;gap:12px;align-items:center;padding:14px 16px;cursor:pointer}
.day-head-text{flex:1;min-width:0}
.day-head-text>span{display:block}
.kicker{font-size:.82rem;font-weight:700;color:var(--muted)}
.day.today .kicker{color:var(--accent)}
.day-title{font-weight:800;font-size:1.05rem;margin:2px 0}
.cover{width:64px;height:64px;border-radius:12px;background:var(--soft);border:1px solid var(--line);overflow:hidden;flex-shrink:0}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.chev{color:var(--muted);font-size:1.4rem;transition:transform .2s}
.day.open .chev{transform:rotate(90deg)}
.day-body{border-top:1px solid var(--line);padding:16px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
.box{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--soft);min-width:0}
.box ul{margin:0;padding-left:18px}
.box li{margin-bottom:4px;overflow-wrap:anywhere}
.box.strict{border-color:#fecaca;background:#fff1f2}
.box.strict h3,.box.strict li{color:#991b1b}
.box.strict li{font-weight:700}
@media (prefers-color-scheme:dark){.box.strict{background:#3a1d22;border-color:#7f1d1d}.box.strict h3,.box.strict li{color:#fecaca}.today-must{color:#fca5a5}}
.sub{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.row h3{margin:0}
input,textarea,select{width:100%;font:inherit;font-size:1rem;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
textarea{resize:vertical;line-height:1.5}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.notes{min-height:130px}
.diary{white-space:pre-wrap;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px;overflow-wrap:anywhere}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.thumb{all:unset;display:block;cursor:pointer;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--soft)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.day-head:focus-visible,.thumb:focus-visible,.btn:focus-visible,a:focus-visible,.lb-nav:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}
/* Dialogs */
dialog.sheet{width:min(640px,calc(100vw - 24px));max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);border:1px solid var(--line);border-radius:var(--r);padding:0;background:var(--card);color:var(--text);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(15,23,42,.55)}
.dlg-form{padding:18px;display:grid;gap:12px}
.dlg-form h2{margin:0;outline:none}
.field{display:grid;gap:6px}
.field label{font-size:.88rem;font-weight:700;color:var(--muted)}
.hint{font-size:.8rem;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-error{color:var(--danger);font-weight:700;margin:0;min-height:1.2em}
.dlg-actions{margin-top:0;align-items:center}
.spacer{flex:1}
/* Lightbox */
dialog.lightbox{width:100vw;height:100vh;height:100dvh;max-width:none;max-height:none;margin:0;padding:0;border:0;background:#0b1220;color:#fff;flex-direction:column}
dialog.lightbox[open]{display:flex}
dialog.lightbox::backdrop{background:#0b1220}
.lb-top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:calc(8px + env(safe-area-inset-top)) 14px 8px}
.lb-count{font-weight:700;color:rgba(255,255,255,.8)}
.lb-main{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:8px}
.lb-main img{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:999px;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:1.5rem;cursor:pointer}
.lb-nav.prev{left:10px}
.lb-nav.next{right:10px}
.lb-bottom{width:100%;max-width:920px;margin:0 auto;padding:12px 14px calc(14px + env(safe-area-inset-bottom));border-top:1px solid rgba(255,255,255,.12)}
.lb-bottom input{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);color:#fff}
.lb-bottom input::placeholder{color:rgba(255,255,255,.55)}
.lb-caption-text{margin:0 0 6px;font-weight:700}
.lb-meta{color:rgba(255,255,255,.7);font-size:.85rem;margin-top:8px}
/* Toast */
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:calc(100vw - 32px);background:#111827;color:#fff;padding:10px 14px;border-radius:12px;font-weight:700;font-size:.9rem;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.toast.show{opacity:1}
@media (max-width:680px){
  .grid,.two{grid-template-columns:1fr}
  h1{font-size:1.4rem}
  .cover{width:56px;height:56px}
  .trip-cover{width:68px;height:68px}
}
@media (prefers-reduced-motion:reduce){.chev,.toast{transition:none}}
</style>

<body>
<main id="app" class="wrap"></main>
<noscript><p style="padding:16px">This diary needs JavaScript to run.</p></noscript>
<script id="app-js">
(() => {
'use strict';

/* ================= Config ================= */
const FULL_MAX = 1600, FULL_Q = 0.82;     // stored photo: long edge (px), JPEG quality
const THUMB_MAX = 360, THUMB_Q = 0.72;    // thumbnail used in lists and covers
const MAX_TRIP_DAYS = 90;
const PACE = { easy: 'Easy day', medium: 'Medium day', long: 'Long day' };
const PHASE = { upcoming: 'Upcoming', now: 'On the trip', done: 'Completed' };
const SECTIONS = [
  ['fixed', 'Strict times', 'Times you must not miss, one per line'],
  ['plan', 'Plan', ''],
  ['transport', 'Transport & parking', ''],
  ['food', 'Food', ''],
  ['bookings', 'Bookings', 'Hotels, tickets, reservation numbers'],
];

/* ================= Archive mode ================= */
// An exported archive is this same file plus a <script id="archive-data"> block.
const ARCHIVE_EL = document.getElementById('archive-data');
const READ_ONLY = !!ARCHIVE_EL;
const ARCHIVE = (() => {
  if (!ARCHIVE_EL) return null;
  try { return JSON.parse(ARCHIVE_EL.textContent); } catch (e) { console.error(e); return null; }
})();

/* ================= Utilities ================= */
const $ = (sel, root = document) => root.querySelector(sel);
const app = $('#app');
const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ESC[c]);
const uid = () => globalThis.crypto?.randomUUID?.() || `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}`;
const nowIso = () => new Date().toISOString();
const lines = s => String(s || '').split('\n').map(x => x.trim()).filter(Boolean);
const list = items => `<ul>${items.map(i => `<li>${esc(i)}</li>`).join('')}</ul>`;
const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;
const deviceTz = () => Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';

const addDays = (ymd, n) => { const d = new Date(ymd + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const daysBetween = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 864e5);
function dateRange(start, end) {
  const out = [];
  for (let d = start; d <= end && out.length < 366; d = addDays(d, 1)) out.push(d);
  return out;
}
function fmtDay(ymd, opts = { weekday: 'short', day: 'numeric', month: 'short' }) {
  return new Intl.DateTimeFormat('en-SG', { ...opts, timeZone: 'UTC' }).format(new Date(ymd + 'T00:00:00Z'));
}
function fmtRange(t) {
  if (!t.startDate) return '';
  const o = withYear => ({ day: 'numeric', month: 'short', ...(withYear ? { year: 'numeric' } : {}) });
  if (t.startDate === t.endDate) return fmtDay(t.startDate, o(true));
  return `${fmtDay(t.startDate, o(t.startDate.slice(0, 4) !== t.endDate.slice(0, 4)))} – ${fmtDay(t.endDate, o(true))}`;
}
function fmtStamp(iso, tz) {
  try { return new Intl.DateTimeFormat('en-SG', { dateStyle: 'medium', timeStyle: 'short', timeZone: tz || undefined }).format(new Date(iso)); }
  catch { return iso; }
}
function todayIn(tz) {
  try { return new Intl.DateTimeFormat('en-CA', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date()); }
  catch { return nowIso().slice(0, 10); }
}
function validTz(tz) {
  if (!tz) return false;
  try { new Intl.DateTimeFormat('en', { timeZone: tz }); return true; } catch { return false; }
}
function tzLabel(tz) {
  let off = '';
  try { off = new Intl.DateTimeFormat('en', { timeZone: tz, timeZoneName: 'shortOffset' }).formatToParts(new Date()).find(p => p.type === 'timeZoneName')?.value || ''; } catch {}
  return `${String(tz || '').split('/').pop().replace(/_/g, ' ')}${off ? ` (${off})` : ''}`;
}
function fmtBytes(b) {
  if (!Number.isFinite(b) || b <= 0) return '0 KB';
  if (b >= 1024 ** 3) return `${(b / 1024 ** 3).toFixed(1)} GB`;
  if (b >= 1024 ** 2) return `${(b / 1024 ** 2).toFixed(1)} MB`;
  return `${Math.round(b / 1024)} KB`;
}
const slug = v => String(v || 'trip').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60) || 'trip';
function parseLinks(text) {
  return lines(text).map(l => {
    if (/^https?:\/\/\S+$/i.test(l)) { try { return { text: new URL(l).hostname.replace(/^www\./, ''), url: l }; } catch { return null; } }
    const i = l.lastIndexOf('|');
    return i < 0 ? null : { text: l.slice(0, i).trim(), url: l.slice(i + 1).trim() };
  }).filter(x => x && x.text && /^https?:\/\//i.test(x.url));
}

let toastTimer;
function toast(msg, ms = 2400) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  if (ms) toastTimer = setTimeout(() => el.classList.remove('show'), ms);
}

/* ================= Storage (IndexedDB) ================= */
// trips: { id, name, destination, startDate, endDate, timeZone, travellers, info[], days[] }
// photos: { id, tripId, day, blob, thumb, caption, takenAt, addedAt }
const DB = (() => {
  let dbp = null;
  const open = () => dbp ??= new Promise((resolve, reject) => {
    const req = indexedDB.open('travel-diary', 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      db.createObjectStore('trips', { keyPath: 'id' });
      db.createObjectStore('photos', { keyPath: 'id' }).createIndex('tripId', 'tripId');
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => { dbp = null; reject(req.error); };
  });
  async function tx(stores, mode, fn) {
    const db = await open();
    return new Promise((resolve, reject) => {
      const t = db.transaction(stores, mode);
      let result;
      const req = fn(t);
      if (req) req.onsuccess = () => { result = req.result; };
      t.oncomplete = () => resolve(result);
      t.onabort = () => reject(t.error || new Error('Storage transaction failed'));
    });
  }
  const photos = t => t.objectStore('photos');
  const trips = t => t.objectStore('trips');
  return {
    listTrips: () => tx('trips', 'readonly', t => trips(t).getAll()),
    getTrip: id => tx('trips', 'readonly', t => trips(t).get(id)),
    putTrip: trip => tx('trips', 'readwrite', t => trips(t).put(trip)),
    tripPhotos: id => tx('photos', 'readonly', t => photos(t).index('tripId').getAll(id)),
    countPhotos: id => tx('photos', 'readonly', t => photos(t).index('tripId').count(id)),
    firstPhoto: id => tx('photos', 'readonly', t => photos(t).index('tripId').get(id)),
    putPhoto: p => tx('photos', 'readwrite', t => photos(t).put(p)),
    deletePhoto: id => tx('photos', 'readwrite', t => photos(t).delete(id)),
    deleteTrip: id => tx(['trips', 'photos'], 'readwrite', t => {
      trips(t).delete(id);
      const cur = photos(t).index('tripId').openKeyCursor(IDBKeyRange.only(id));
      cur.onsuccess = () => { const c = cur.result; if (c) { photos(t).delete(c.primaryKey); c.continue(); } };
    }),
  };
})();

let persistAsked = false;
function askPersist() {
  // Without this, Safari may clear site storage after a period of no visits.
  if (persistAsked || READ_ONLY) return;
  persistAsked = true;
  navigator.storage?.persist?.().catch(() => {});
}

/* ================= Images ================= */
async function loadBitmap(blob) {
  if ('createImageBitmap' in window) {
    try { return await createImageBitmap(blob, { imageOrientation: 'from-image' }); } catch {}
  }
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(blob);
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('This image format cannot be read.')); };
    img.src = url;
  });
}
function resize(src, max, quality) {
  const w = src.naturalWidth || src.width, h = src.naturalHeight || src.height;
  const s = Math.min(1, max / Math.max(w, h));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w * s));
  c.height = Math.max(1, Math.round(h * s));
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  return new Promise((resolve, reject) => c.toBlob(b => {
    c.width = c.height = 0; // free canvas memory early (matters on iPhone)
    b ? resolve(b) : reject(new Error('Image encoding failed.'));
  }, 'image/jpeg', quality));
}
async function processImage(file) {
  const src = await loadBitmap(file);
  try { return { blob: await resize(src, FULL_MAX, FULL_Q), thumb: await resize(src, THUMB_MAX, THUMB_Q) }; }
  finally { src.close?.(); }
}
async function makeThumb(blob) {
  const src = await loadBitmap(blob);
  try { return await resize(src, THUMB_MAX, THUMB_Q); } finally { src.close?.(); }
}
const blobToDataUrl = blob => new Promise((resolve, reject) => {
  const r = new FileReader();
  r.onload = () => resolve(r.result);
  r.onerror = () => reject(r.error);
  r.readAsDataURL(blob);
});
function dataUrlToBlob(url) {
  const comma = url.indexOf(',');
  const type = (url.slice(0, comma).match(/data:([^;,]+)/) || [])[1] || 'image/jpeg';
  const bin = atob(url.slice(comma + 1));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], { type });
}

/* ================= State ================= */
const state = { trip: null, photos: [], open: new Set(), lb: null };
let byDay = new Map();          // day (YYYY-MM-DD) -> photos, oldest first
const urls = new Map();         // object URLs we created, so we can release them

function indexPhotos() {
  state.photos.sort((a, b) => String(a.takenAt).localeCompare(String(b.takenAt)) || String(a.addedAt).localeCompare(String(b.addedAt)));
  byDay = new Map();
  for (const p of state.photos) {
    if (!byDay.has(p.day)) byDay.set(p.day, []);
    byDay.get(p.day).push(p);
  }
}
const photosFor = date => byDay.get(date) || [];

function photoSrc(p, thumb = false) {
  if (READ_ONLY) return thumb ? (p.thumbUrl || p.dataUrl) : p.dataUrl;
  const key = thumb ? `${p.id}#t` : p.id;
  if (!urls.has(key)) urls.set(key, URL.createObjectURL(thumb ? (p.thumb || p.blob) : p.blob));
  return urls.get(key);
}
function revokePhoto(id) {
  for (const k of [id, `${id}#t`]) if (urls.has(k)) { URL.revokeObjectURL(urls.get(k)); urls.delete(k); }
}
function revokeAll() { urls.forEach(u => URL.revokeObjectURL(u)); urls.clear(); }

const newDay = date => ({ date, title: '', summary: '', pace: 'easy', fixed: [], plan: [], transport: [], food: [], bookings: [], links: [], notes: '', coverId: '' });
const getDay = date => state.trip?.days.find(d => d.date === date);
const dayHasContent = d => !!(d.title || d.summary || d.notes || d.links?.length || SECTIONS.some(([k]) => d[k]?.length) || photosFor(d.date).length);
function tripPhase(t) {
  const today = todayIn(t.timeZone);
  return today < t.startDate ? 'upcoming' : today > t.endDate ? 'done' : 'now';
}
// Builds one day per date. Days outside the new range are kept only if they have content.
function setRange(trip, start, end) {
  const existing = new Map(trip.days.map(d => [d.date, d]));
  const range = dateRange(start, end), inRange = new Set(range);
  const kept = trip.days.filter(d => !inRange.has(d.date) && dayHasContent(d));
  trip.days = [...range.map(dt => existing.get(dt) || newDay(dt)), ...kept].sort((a, b) => a.date.localeCompare(b.date));
  return kept.length;
}
async function saveTrip() {
  if (READ_ONLY || !state.trip) return;
  state.trip.updatedAt = nowIso();
  await DB.putTrip(state.trip);
  askPersist();
}

/* Day notes: debounced autosave */
let noteTimer = null, noteStatusEl = null;
function queueNoteSave(date, text, statusEl) {
  const d = getDay(date);
  if (!d) return;
  d.notes = text;
  noteStatusEl = statusEl;
  if (statusEl) statusEl.textContent = 'Saving…';
  clearTimeout(noteTimer);
  noteTimer = setTimeout(flushNotes, 700);
}
async function flushNotes() {
  if (noteTimer === null) return;
  clearTimeout(noteTimer);
  noteTimer = null;
  const el = noteStatusEl;
  try {
    await saveTrip();
    if (el) el.textContent = 'Saved';
  } catch (e) {
    console.error(e);
    if (el) el.textContent = 'Not saved. Storage may be full.';
    toast('Notes could not be saved');
  }
}

/* ================= Dialogs ================= */
const field = (id, label, control, hint = '') =>
  `<div class="field"><label for="f-${id}">${label}</label>${control}${hint ? `<span class="hint">${hint}</span>` : ''}</div>`;

function formDialog({ title, body, submit = 'Save', cancel = 'Cancel', extra = '', validate }) {
  return new Promise(resolve => {
    const dlg = $('#dlg');
    dlg.innerHTML = `<form class="dlg-form" novalidate>
      <h2 tabindex="-1" autofocus>${esc(title)}</h2>
      ${body}
      <p class="form-error" role="alert"></p>
      <div class="actions dlg-actions">${extra}<span class="spacer"></span>
        ${cancel ? `<button type="button" class="btn secondary" data-dlg="cancel">${esc(cancel)}</button>` : ''}
        <button type="submit" class="btn">${esc(submit)}</button>
      </div>
    </form>`;
    const form = $('form', dlg), err = $('.form-error', form);
    let done = false;
    const finish = value => {
      if (done) return;
      done = true;
      if (dlg.open) dlg.close();
      resolve(value);
    };
    form.addEventListener('submit', e => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(form));
      const msg = validate?.(data);
      if (msg) { err.textContent = msg; return; }
      finish(data);
    });
    form.addEventListener('click', e => {
      const b = e.target.closest('[data-dlg]');
      if (b) finish(b.dataset.dlg === 'cancel' ? null : { action: b.dataset.dlg });
    });
    // Esc / system close. The open check ignores a stale close event from a previous dialog.
    dlg.onclose = () => { if (!dlg.open) finish(null); };
    dlg.showModal();
  });
}

function pickFiles(accept, multiple) {
  return new Promise(resolve => {
    const input = $('#file-input');
    input.value = '';
    input.accept = accept;
    input.multiple = multiple;
    input.onchange = () => resolve([...input.files]);
    input.oncancel = () => resolve([]);
    input.click();
  });
}

async function addPhotos(date) {
  const files = (await pickFiles('image/*', true)).filter(f => !f.type || f.type.startsWith('image/'));
  if (!files.length) return;
  const tripId = state.trip.id;
  let ok = 0, failed = 0;
  for (const [i, file] of files.entries()) {
    toast(`Saving photo ${i + 1} of ${files.length}…`, 0);
    try {
      const { blob, thumb } = await processImage(file);
      const added = nowIso();
      const p = { id: uid(), tripId, day: date, blob, thumb, caption: '', takenAt: file.lastModified ? new Date(file.lastModified).toISOString() : added, addedAt: added };
      await DB.putPhoto(p);
      if (state.trip?.id === tripId) state.photos.push(p);
      ok++;
    } catch (e) { console.error(e); failed++; }
  }
  askPersist();
  if (state.trip?.id !== tripId) return;
  indexPhotos();
  renderDay(date);
  toast(failed ? `Saved ${ok}. ${plural(failed, 'file')} couldn’t be read.` : `Saved ${plural(ok, 'photo')}`, failed ? 4000 : 2400);
}

function openLightbox(date, index) {
  const items = photosFor(date);
  if (!items.length) return;
  state.lb = { date, items, i: Math.min(Math.max(0, index), items.length - 1) };
  renderLightbox();
  $('#lb').showModal();
}
function renderLightbox() {
  const { date, items, i } = state.lb, p = items[i], d = getDay(date);
  const img = $('#lb-img');
  img.src = photoSrc(p);
  img.alt = p.caption || `Photo ${i + 1} from ${fmtDay(date)}`;
  $('#lb-count').textContent = `${i + 1} / ${items.length}`;
  document.querySelectorAll('#lb .lb-nav').forEach(b => { b.hidden = items.length < 2; });
  if (READ_ONLY) {
    $('#lb-caption-text').textContent = p.caption || '';
  } else {
    $('#lb-caption').value = p.caption || '';
    const coverBtn = $('#lb-cover'), isCover = d?.coverId === p.id;
    coverBtn.disabled = isCover;
    coverBtn.textContent = isCover ? 'Day cover' : 'Set as day cover';
  }
  $('#lb-meta').textContent = [fmtDay(date), p.takenAt ? fmtStamp(p.takenAt, state.trip.timeZone) : '', p.blob ? fmtBytes(p.blob.size) : ''].filter(Boolean).join(' · ');
}
function stepLightbox(n) {
  if (!state.lb || state.lb.items.length < 2) return;
  state.lb.i = (state.lb.i + n + state.lb.items.length) % state.lb.items.length;
  renderLightbox();
}
async function lightboxAction(act) {
  const lb = $('#lb');
  if (act === 'close') return lb.close();
  if (act === 'prev') return stepLightbox(-1);
  if (act === 'next') return stepLightbox(1);
  if (READ_ONLY || !state.lb) return;
  const { date, items, i } = state.lb, p = items[i], d = getDay(date);
  if (act === 'caption') {
    p.caption = $('#lb-caption').value.trim();
    await DB.putPhoto(p);
    toast('Caption saved');
  } else if (act === 'cover') {
    d.coverId = p.id;
    await saveTrip();
    renderLightbox();
    toast('Day cover set');
  } else if (act === 'delete') {
    if (!confirm('Delete this photo? This can’t be undone.')) return;
    await DB.deletePhoto(p.id);
    revokePhoto(p.id);
    state.photos = state.photos.filter(x => x !== p);
    if (d?.coverId === p.id) { d.coverId = ''; await saveTrip(); }
    indexPhotos();
    state.lb.items = photosFor(date);
    if (!state.lb.items.length) return lb.close();
    state.lb.i = Math.min(i, state.lb.items.length - 1);
    renderLightbox();
    toast('Photo deleted');
  }
}
function bindLightbox() {
  const lb = $('#lb'), main = $('#lb-main');
  lb.addEventListener('click', e => {
    const b = e.target.closest('[data-lb]');
    if (b) lightboxAction(b.dataset.lb).catch(err => { console.error(err); toast('That didn’t work. Try again.'); });
  });
  lb.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') {
      if (e.key === 'Enter') { e.preventDefault(); lightboxAction('caption').catch(console.error); }
      return;
    }
    if (e.key === 'ArrowLeft') stepLightbox(-1);
    if (e.key === 'ArrowRight') stepLightbox(1);
  });
  lb.addEventListener('close', () => {
    if (!state.lb) return;
    const { date } = state.lb;
    state.lb = null;
    $('#lb-img').removeAttribute('src');
    renderDay(date); // reflect caption / cover / deletion changes
  });
  // One-finger swipe to change photo; ignored during pinch-zoom.
  let startX = null;
  main.addEventListener('touchstart', e => { startX = e.touches.length === 1 ? e.touches[0].clientX : null; }, { passive: true });
  main.addEventListener('touchmove', e => { if (e.touches.length > 1) startX = null; }, { passive: true });
  main.addEventListener('touchend', e => {
    if (startX === null || e.touches.length) return;
    const dx = e.changedTouches[0].clientX - startX;
    startX = null;
    if (Math.abs(dx) >= 50) stepLightbox(dx > 0 ? -1 : 1);
  }, { passive: true });
}

// The archive is this app's own CSS + JS plus the trip data, so it looks and works the same, read-only.
// It is assembled from parts so the browser never has to hold one giant string.
async function exportArchive() {
  await flushNotes();
  const btn = app.querySelector('[data-act="export"]');
  if (btn) btn.disabled = true;
  try {
    const t = state.trip, photos = state.photos;
    const safe = s => s.replace(/</g, '\\u003c');
    const head = $('head link[rel="icon"]')?.outerHTML || '';
    const parts = [
      `<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n<title>${esc(t.name)} · Travel Diary</title>\n${head}\n<style id="app-css">${$('#app-css').textContent}</style>\n</head>\n<body>\n<main id="app" class="wrap"></main>\n<script id="archive-data" type="application/json">`,
      safe(JSON.stringify({ format: 'travel-diary', version: 2, exportedAt: nowIso(), trip: t })).slice(0, -1) + ',"photos":[',
    ];
    for (const [i, p] of photos.entries()) {
      toast(`Packing photo ${i + 1} of ${photos.length}…`, 0);
      const rec = { id: p.id, day: p.day, caption: p.caption, takenAt: p.takenAt, addedAt: p.addedAt, dataUrl: await blobToDataUrl(p.blob), thumbUrl: p.thumb ? await blobToDataUrl(p.thumb) : '' };
      parts.push((i ? ',' : '') + safe(JSON.stringify(rec)));
    }
    parts.push(`]}</${'script'}>\n<script id="app-js">${$('#app-js').textContent}</${'script'}>\n</body>\n</html>\n`);
    const blob = new Blob(parts, { type: 'text/html' });
    toast('Archive ready', 1200);
    await showExportReady(blob, `${slug(t.name)}-${t.startDate}.html`);
  } finally {
    if (btn) btn.disabled = false;
  }
}
async function showExportReady(blob, name) {
  const url = URL.createObjectURL(blob);
  const file = typeof File === 'function' ? new File([blob], name, { type: 'text/html' }) : null;
  const canShare = !!(file && navigator.canShare?.({ files: [file] }));
  const done = formDialog({
    title: 'Archive ready',
    submit: 'Done',
    cancel: '',
    body: `<p style="margin:0"><b>${esc(name)}</b> · ${fmtBytes(blob.size)}</p>
      <p class="muted small" style="margin:0">One file with the itinerary, diary notes and ${plural(state.photos.length, 'photo')}. It opens in any browser, works offline and is view-only.</p>
      <p class="muted small" style="margin:0">On iPhone, tap Download file. It's saved to the Downloads folder in the Files app.</p>
      <div class="actions"><a class="btn" href="${url}" download="${esc(name)}">Download file</a>
        ${canShare ? '<button type="button" class="btn secondary" data-share>Send to another app…</button>' : ''}</div>`,
  });
  // Share the file only. Adding a title or text makes iOS save it as an extra text file.
  $('#dlg [data-share]')?.addEventListener('click', () => navigator.share({ files: [file] }).catch(() => {}));
  await done;
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

/* ================= Import (archives + previous Nagoya version) ================= */
function parseArchive(text) {
  const m = text.match(/<script id="archive-data" type="application\/json">([\s\S]*?)<\/script>/);
  if (m) {
    const data = JSON.parse(m[1]);
    if (data?.trip?.days) return { trip: data.trip, photos: data.photos || [] };
  }
  // Archive exported by the earlier single-trip version of this app.
  const old = text.match(/\/\* ARCHIVE_DATA_START \*\/\s*const EMBEDDED_ARCHIVE = ([\s\S]*?);\s*\/\* ARCHIVE_DATA_END \*\//);
  if (old) {
    const a = JSON.parse(old[1]);
    if (a) return { trip: legacyTrip(a.tripDays || [], a.dayNotes || {}, a.tripInfo?.title, a.tripInfo?.subtitle, (a.photos || []).map(p => p.dayId)), photos: a.photos || [] };
  }
  return null;
}

function legacyTrip(days, notes, title, subtitle, extraDates = []) {
  const map = new Map();
  for (const d of days) {
    if (!d?.date) continue;
    map.set(d.date, {
      ...newDay(d.date), title: d.title || '', summary: d.summary || '', pace: PACE[d.status] ? d.status : 'easy',
      fixed: d.strictTimes || [], plan: d.itinerary || [], transport: [...(d.transport || []), ...(d.parking || [])],
      food: d.food || [], bookings: [...(d.bookings || []), ...(d.notes || [])],
      links: [...(d.gettingThere || []), ...(d.attractionLinks || [])],
    });
  }
  for (const date of [...Object.keys(notes), ...extraDates]) {
    if (/^\d{4}-\d{2}-\d{2}$/.test(date || '') && !map.has(date)) map.set(date, newDay(date));
  }
  for (const [date, text] of Object.entries(notes)) if (map.has(date)) map.get(date).notes = text || '';
  const dates = [...map.keys()].sort();
  const start = dates[0] || todayIn(deviceTz()), end = dates.at(-1) || start;
  for (const dt of dateRange(start, end)) if (!map.has(dt)) map.set(dt, newDay(dt));
  return {
    name: title || 'Imported trip', destination: '', startDate: start, endDate: end,
    timeZone: 'Asia/Tokyo', // the earlier version always used Japan time
    travellers: '', info: subtitle ? [subtitle] : [],
    days: [...map.values()].sort((a, b) => a.date.localeCompare(b.date)),
  };
}

async function storeImported(src, photos) {
  const now = nowIso();
  const days = (src.days || []).map(d => ({ ...newDay(d.date), ...d }));
  const dates = days.map(d => d.date).sort();
  const trip = {
    ...src, id: uid(), days, createdAt: src.createdAt || now, updatedAt: now,
    startDate: src.startDate || dates[0], endDate: src.endDate || dates.at(-1),
    timeZone: validTz(src.timeZone) ? src.timeZone : deviceTz(), info: src.info || [],
  };
  await DB.putTrip(trip);
  const idMap = new Map();
  for (const [i, p] of photos.entries()) {
    toast(`Importing photo ${i + 1} of ${photos.length}…`, 0);
    if (!p?.dataUrl) continue;
    try {
      const blob = dataUrlToBlob(p.dataUrl);
      const thumb = p.thumbUrl ? dataUrlToBlob(p.thumbUrl) : await makeThumb(blob);
      const id = uid();
      await DB.putPhoto({ id, tripId: trip.id, day: p.day || p.dayId, blob, thumb, caption: p.caption || '', takenAt: p.takenAt || p.createdAt || now, addedAt: p.addedAt || p.createdAt || now });
      idMap.set(p.id, id);
    } catch (e) { console.error('Photo import failed', e); }
  }
  for (const d of trip.days) d.coverId = idMap.get(d.coverId) || '';
  await DB.putTrip(trip);
  askPersist();
  return trip;
}

async function importArchive() {
  const [file] = await pickFiles('.html,.htm,text/html', false);
  if (!file) return;
  toast('Reading archive…', 0);
  let parsed = null;
  try { parsed = parseArchive(await file.text()); } catch (e) { console.error(e); }
  if (!parsed) { toast('That file isn’t a Travel Diary archive.', 4000); return; }
  const trip = await storeImported(parsed.trip, parsed.photos);
  toast(`Imported “${trip.name}”`);
  location.hash = `#/trip/${encodeURIComponent(trip.id)}`;
}

// One-time copy of data saved by the earlier Nagoya-only version (same website address only).
function readLegacyPhotos() {
  return new Promise(resolve => {
    const req = indexedDB.open('nagoya2026Photos-v1');
    req.onupgradeneeded = () => req.transaction.abort(); // it never existed: don't create it
    req.onerror = () => resolve([]);
    req.onsuccess = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains('photos')) { db.close(); resolve([]); return; }
      const all = db.transaction('photos').objectStore('photos').getAll();
      all.onsuccess = () => { db.close(); resolve(all.result || []); };
      all.onerror = () => { db.close(); resolve([]); };
    };
  });
}
async function migrateLegacyStorage() {
  const FLAG = 'travel-diary-legacy-checked';
  try { if (localStorage.getItem(FLAG)) return; } catch { return; }
  let days = [];
  try { days = JSON.parse(localStorage.getItem('nagoya2026EditableDays-v1') || '[]'); } catch {}
  const prefix = 'nagoya2026Notes-v1-', notes = {};
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k?.startsWith(prefix)) { const v = localStorage.getItem(k) || ''; if (v.trim()) notes[k.slice(prefix.length)] = v; }
  }
  const photos = await readLegacyPhotos();
  if ((Array.isArray(days) && days.length) || Object.keys(notes).length || photos.length) {
    await storeImported(legacyTrip(Array.isArray(days) ? days : [], notes, 'Japan 2026 · Nagoya', '', photos.map(p => p.dayId)), photos);
    toast('Copied your Nagoya trip from the previous version', 4000);
  }
  localStorage.setItem(FLAG, '1');
}

/* ================= Events & routing ================= */
const ACTIONS = {
  'new-trip': () => newTrip(),
  'import': () => importArchive(),
  'edit-trip': () => editTrip(),
  'export': () => exportArchive(),
  'edit-day': date => editDay(date),
  'add-photos': date => addPhotos(date),
  'view-photo': (date, el) => openLightbox(date, Number(el.dataset.index)),
  'toggle': date => {
    state.open.has(date) ? state.open.delete(date) : state.open.add(date);
    flushNotes();
    renderDay(date);
  },
  'goto': date => {
    state.open.add(date);
    renderDay(date);
    document.getElementById(`day-${date}`)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  },
};

function bindApp() {
  app.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    const fn = el && ACTIONS[el.dataset.act];
    if (!fn) return;
    const date = el.dataset.date || el.closest('[data-day]')?.dataset.day;
    Promise.resolve(fn(date, el)).catch(err => { console.error(err); toast(err?.message ? `Not saved: ${err.message}` : 'Something went wrong. Try again.', 4000); });
  });
  app.addEventListener('input', e => {
    if (!e.target.matches('textarea[data-act="notes"]')) return;
    queueNoteSave(e.target.closest('[data-day]').dataset.day, e.target.value, e.target.parentElement.querySelector('[data-role="note-status"]'));
  });
  app.addEventListener('focusout', e => { if (e.target.matches('textarea[data-act="notes"]')) flushNotes(); });
}

async function route() {
  await flushNotes();
  if ($('#lb').open) $('#lb').close();
  const m = location.hash.match(/^#\/trip\/([^/]+)$/);
  if (m) await openTrip(decodeURIComponent(m[1]));
  else await renderHome();
  window.scrollTo(0, 0);
}

function mountShell() {
  document.body.insertAdjacentHTML('beforeend', `
    <dialog id="dlg" class="sheet"></dialog>
    <dialog id="lb" class="lightbox" aria-label="Photo viewer">
      <div class="lb-top"><span id="lb-count" class="lb-count"></span><button type="button" class="btn ghost" data-lb="close">Close</button></div>
      <div class="lb-main" id="lb-main">
        <img id="lb-img" alt="">
        <button type="button" class="lb-nav prev" data-lb="prev" aria-label="Previous photo">‹</button>
        <button type="button" class="lb-nav next" data-lb="next" aria-label="Next photo">›</button>
      </div>
      <div class="lb-bottom">
        ${READ_ONLY ? '<p id="lb-caption-text" class="lb-caption-text"></p>' : `
          <input id="lb-caption" type="text" maxlength="200" placeholder="Add a caption…" aria-label="Photo caption">
          <div class="actions">
            <button type="button" class="btn" data-lb="caption">Save caption</button>
            <button type="button" class="btn ghost" data-lb="cover" id="lb-cover">Set as day cover</button>
            <button type="button" class="btn danger" data-lb="delete">Delete photo</button>
          </div>`}
        <div id="lb-meta" class="lb-meta"></div>
      </div>
    </dialog>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <input type="file" id="file-input" hidden>`);
}

async function init() {
  mountShell();
  bindLightbox();
  bindApp();
  if (READ_ONLY) {
    if (!ARCHIVE?.trip) { app.innerHTML = '<div class="panel"><h2>This archive can’t be opened</h2><p class="muted">The file is incomplete or damaged. Export it again from the diary.</p></div>'; return; }
    await openTrip();
    return;
  }
  if (!('indexedDB' in window)) { app.innerHTML = '<div class="panel"><h2>This browser can’t store a diary</h2><p class="muted">Open the diary in an up-to-date Safari, Chrome or Edge.</p></div>'; return; }
  try { await migrateLegacyStorage(); } catch (e) { console.error('Legacy import skipped', e); }
  window.addEventListener('hashchange', () => route().catch(console.error));
  document.addEventListener('visibilitychange', () => { if (document.hidden) flushNotes(); else renderToday(); });
  window.addEventListener('pagehide', () => { flushNotes(); });
  await route();
}

init().catch(err => {
  console.error(err);
  app.innerHTML = `<div class="panel"><h2>The diary didn’t load</h2><p class="muted">${esc(err?.message || err)}. Reload the page to try again.</p></div>`;
});
})();
</script>
